[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tap-electric-qr-recovery"
version = "0.1.0"
description = "A data collection, QR recovery, and model-improvement service for degraded EV charger stickers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Siddique Mangi" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.12,<1.0",
  "opencv-python-headless>=4.10,<5.0",
  "numpy>=1.26,<3.0",
  "pillow>=10.4,<12.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2,<3.0",
  "transformers>=4.45,<5.0",
  "accelerate>=0.34,<2.0",
]
s3 = ["boto3>=1.35,<2.0"]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "qrcode[pil]>=8.0,<9.0",
  "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
